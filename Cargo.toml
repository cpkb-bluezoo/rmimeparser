[package]
name = "rmimeparser"
version = "0.4.0"
edition = "2021"
rust-version = "1.70"
description = "Push-based MIME and RFC 5322 message parser and writer (gumdrop-style)"
readme = "README.md"
license = "LGPL-2.1-or-later"
repository = "https://github.com/cpkb-bluezoo/rmimeparser"
keywords = ["mime", "email", "rfc5322", "parser", "streaming"]
categories = ["email", "parser-implementations"]

[lib]
name = "rmimeparser"
path = "src/lib.rs"

[dev-dependencies]
libtest-mimic = "0.8"

[features]
# Opt-in harness that clones rspamd/rspamd-test-corpus and parses every .eml.
rspamd-corpus = []

[[test]]
name = "mime_utils_test"
path = "tests/tests/mime_utils_test.rs"

[[test]]
name = "rspamd_corpus"
path = "tests/corpus/rspamd_corpus.rs"
required-features = ["rspamd-corpus"]
harness = false
